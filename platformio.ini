; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Two build environments are provided:
;   fossa-ST7796  — default, matches tft_config.txt      (480×320 ST7796)
;   fossa-ILI9341 — matches tft_config_IL9341.txt        (ILI9341)
;
; Build:   pio run -e fossa-ST7796
; Upload:  pio run -e fossa-ST7796 --target upload
; Monitor: pio device monitor

[platformio]
; Keep the existing source layout — no need to move files
src_dir = fossa
; Only build/upload this environment by default.
; Use fossa-ST7796 for WT32-SC01 with horizontal landscape orientation (rotation=1).
; default_envs = fossa-ST7796
; Use fossa-ST7796 for WT32-SC01 with vertical portrait orientation (rotation=2).
default_envs = fossa-ST7796-rotated
; To use the ILI9341 variant, select it explicitly:
;   pio run -e fossa-ILI9341 --target upload

; ── shared settings ──────────────────────────────────────────────────────────
[env]
platform  = espressif32
board     = ttgo-lora32-v1
framework = arduino

; min_spiffs matches: --build-property "build.partitions=min_spiffs"
board_build.partitions  = min_spiffs.csv
; matches: --build-property "upload.maximum_size=1966080"
board_upload.maximum_size = 1966080

; Library dependencies — pinned to the same versions used in build.sh
lib_deps =
    bodmer/TFT_eSPI                          @ 2.5.43
    bblanchon/ArduinoJson                    @ 7.2.0
    https://github.com/micro-bitcoin/uBitcoin.git @ 0.2.0
    jchristensen/JC_Button                   @ ^2.1.4
    plerup/EspSoftwareSerial                 @ 8.1.0
    adafruit/Adafruit Thermal Printer Library @ 1.4.1

; Local QRCode library (libraries/QRCode/library.properties is auto-detected)
lib_extra_dirs = libraries

monitor_speed = 115200

; ── shared TFT_eSPI flags (referenced from each environment) ─────────────────
[common]
; USER_SETUP_LOADED tells TFT_eSPI to skip its own User_Setup.h lookup
; COIN_INHIBIT_BYPASS=1  skip the inhibit pin entirely (set 0 to re-enable it)
build_flags =
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DCOIN_INHIBIT_BYPASS=1

; ── ST7796 environment (default, tft_config.txt) ─────────────────────────────
[env:fossa-ST7796]
build_flags =
    ${common.build_flags}
    -DST7796_DRIVER=1
    -DTFT_WIDTH=480
    -DTFT_HEIGHT=320
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=21
    -DTFT_RST=22
    -DTFT_BL=23

; ── ST7796 rotated 90° right / portrait (rotation=2) ────────────────────────
[env:fossa-ST7796-rotated]
build_flags =
    ${common.build_flags}
    -DST7796_DRIVER=1
    -DTFT_WIDTH=480
    -DTFT_HEIGHT=320
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=21
    -DTFT_RST=22
    -DTFT_BL=23
    -DDISPLAY_ROTATION=2

; ── ILI9341 environment (tft_config_IL9341.txt) ──────────────────────────────
[env:fossa-ILI9341]
build_flags =
    ${common.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4

; ── Web installer build (settings come from the web installer, not hardcoded) ─
; Same hardware/display as fossa-ST7796-rotated, but INSTALLER_BUILD forces HARDCODED=false so the
; device reads /elements.json (written by the web installer via USB serial).
; Release process: see FIRMWARE.md
;   pio run -e installer-ST7796-rotated
[env:installer-ST7796-rotated]
extends = env:fossa-ST7796-rotated
build_flags =
    ${env:fossa-ST7796-rotated.build_flags}
    -DINSTALLER_BUILD=1
    -DFIRMWARE_VERSION=\"v976739\"
